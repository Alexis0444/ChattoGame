<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Chatto Rocket - Flappy Game</title>
  <meta name="description" content="Chatto Rocket: esquiva los obstáculos y viaja lo más lejos posible con tu cohete espacial." />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div id="side-left-decor">
    <button id="side-play-btn" type="button" aria-label="Jugar Chatto Rocket">
      <span class="btn-glow"></span>
      <span class="btn-text">¡JUGAR! 🚀</span>
    </button>
    <img src="assets/robot-chubby-laptop-dark.png" alt="Robot Chubby" id="chubby-robot-img" />
  </div>
  <div id="game-wrapper">
    <canvas id="gameCanvas" width="480" height="720"></canvas>
    <div id="loading-overlay" class="overlay visible">
      <div class="spinner"></div>
      <p id="loading-text">Cargando Chatto Rocket...</p>
    </div>

    <!-- Modal para ingresar nombre al entrar al Top -->
    <div id="record-modal" class="modal-overlay">
      <div class="modal-card">
        <div class="modal-badge">🎉 ¡NUEVO RÉCORD!</div>
        <h2 class="modal-title">¡Entraste al Top!</h2>
        <p class="modal-desc">Obtuviste <strong id="modal-score" style="color:#38bdf8; font-size:1.2rem;">0</strong> puntos. Ingresa tu nombre para el Salón de la Fama:</p>
        <form id="record-form">
          <input type="text" id="player-name-input" maxlength="12" placeholder="Tu nombre o apodo" autocomplete="off" required />
          <button type="submit" id="save-record-btn">Guardar Récord 🚀</button>
        </form>
      </div>
    </div>
  </div>

  <aside id="side-right-leaderboard">
    <div class="leaderboard-card">
      <div class="leaderboard-header">
        <span class="trophy-icon">🏆</span>
        <div>
          <h3>TOP PUNTAJES</h3>
          <p class="leaderboard-subtitle">Récords Históricos</p>
        </div>
      </div>
      <ul id="leaderboard-list">
        <!-- Generado dinámicamente -->
      </ul>
      <div class="leaderboard-footer">
        <span>⭐ Tu Mejor Marca: <strong id="best-score-display">0</strong></span>
      </div>
    </div>
  </aside>

  <script src="game.js"></script>
</body>
</html>
